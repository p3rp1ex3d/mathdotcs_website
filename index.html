<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="MathDotCs is a collection of notes, videos, and blogs that explore the beauty of mathematics and computer science. We believe that learning should be fun, engaging, and accessible to everyone. Join us on this journey of discovery and let's decode the universe together!"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Patrick+Hand&family=Architects+Daughter&family=Caveat:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@300;400;700&display=swap"
            rel="stylesheet"
        />

        <title>
            MathDotCS — Decoding the universe, one scribble at a time.
        </title>

        <script>
            window.addEventListener(
                "error",
                function (e) {
                    if (
                        e.error instanceof DOMException &&
                        e.error.name === "DataCloneError" &&
                        e.message &&
                        e.message.includes("PerformanceServerTiming")
                    ) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                    }
                },
                true
            );
        </script>
    </head>

    <body>
        <noscript>
            You need to enable JavaScript to run this app.
        </noscript>

        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
